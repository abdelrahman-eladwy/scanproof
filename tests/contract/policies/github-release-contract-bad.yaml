# LIVE fixture: a syntactically valid report without scan scope must not deploy.
apiVersion: scanproof.dev/v1alpha1
kind: PipelineAssurancePolicy
metadata: {name: github-release-contract-bad}
project: {provider: github, id: abdelrahman-eladwy/scanproof}
assurance: {minimum_level: reported_scope}
requirements:
  - id: SAST
    tool: semgrep
    job_name: scan-scope-free
    artifact_name: contract-semgrep-empty
    report_path: semgrep.json
enforcement: {on_unknown: block, on_nothing_applicable: block}
