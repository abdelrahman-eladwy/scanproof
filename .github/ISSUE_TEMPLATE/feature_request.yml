name: Feature request
description: A new scanner, CI platform, check or policy option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What release-assurance gap does this close?
      description: The situation where ScanProof today cannot tell whether a scan really ran or covered the release.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: For a new scanner or platform, link a sample report or API response if you can.
    validations:
      required: true
