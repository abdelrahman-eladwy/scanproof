name: Bug report
description: ScanProof crashed, misread a report, or gave a wrong BLOCKED / INDETERMINATE result.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **A VERIFIED result for missing, failed, masked, stale or foreign evidence is a security
        vulnerability.** Report it privately through the security advisory link instead.
        Never paste tokens; redact project names if needed.
  - type: input
    id: version
    attributes:
      label: ScanProof version
      description: Output of `scanproof --version`, or the commit you installed.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: CI platform
      options: [GitLab, GitHub Actions, Azure DevOps, Jenkins, Bitbucket Pipelines, Local file only]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command and policy (redacted)
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Console output or JSON report (redacted)
      render: text
