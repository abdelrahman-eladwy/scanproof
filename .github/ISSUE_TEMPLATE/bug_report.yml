name: Bug report
description: ScanProof crashed, misread a report, or gave a wrong BLOCKED / INDETERMINATE result.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **A VERIFIED result for missing, failed, masked, stale or foreign evidence is a security
        vulnerability.** Report it privately through the security advisory link instead.
        Never paste tokens; redact project names if needed.
        Maintainers classify bugs as P0 (release-bypass/false VERIFIED/credential leak),
        P1 (incorrect BLOCKED, legitimate release unavailable), or P2 (non-security
        usability/performance). See docs/development/defect-triage.md.
  - type: input
    id: version
    attributes:
      label: ScanProof version
      description: Output of `scanproof --version`, or the commit you installed.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: CI platform
      options: [GitLab, GitHub Actions, Azure DevOps, Jenkins, Bitbucket Pipelines, Local file only]
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact of the bug (public reports only)
      description: For false VERIFIED, a gate bypass or leaked credentials, stop and use the private security advisory form instead.
      options:
        - P1 candidate - legitimate release incorrectly blocked or unavailable
        - P2 candidate - usability, documentation or routine performance
        - Unsure - maintainer triage needed (do not submit sensitive exploit details)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command and policy (redacted)
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Console output or JSON report (redacted)
      render: text
