# Real Sigstore attestations for ScanProof's attestation tests (tests/fixtures/attestations/).
#
# Produces, in one run:
#   sast       Semgrep report + SLSA provenance attestation of that report (signer: this workflow)
#   container  Trivy report on a pinned image + a cosign "vuln" attestation on the image digest
#   reusable   SLSA provenance for the same Semgrep report, signed from a reusable workflow, so the
#              certificate's Build Signer URI is reusable-attest.yml, not this file
#   blob-sign  a plain message signature over the report bytes (`sigstore sign`)
#   self-verify  ScanProof verifies all of the above for this run, expecting 0 / 1 per policy
# On fixtures/attest/** branches, `publish` commits reports + bundles back to the branch.
name: attestation-contract

on:
  workflow_dispatch:
  push:
    branches: ["fixtures/attest/**"]

permissions:
  contents: read

env:
  IMAGE: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc

jobs:
  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.1
    permissions:
      contents: read
      id-token: write       # Sigstore keyless signing (Fulcio certificate from the OIDC token)
      attestations: write   # store the attestation in GitHub's attestations API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p out
          semgrep scan --config p/default --metrics=off --json --output out/semgrep.json examples/gitlab-ci/sample-app/
      - id: prov
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/semgrep.json
      - run: cp "${{ steps.prov.outputs.bundle-path }}" out/semgrep.json.provenance.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: out/

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Trivy scan of the pinned image
        run: |
          mkdir -p out
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker run --rm -v "$PWD/out:/out" aquasec/trivy:0.76.1 image \
            --format json --output /out/trivy.json "$IMAGE"
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # cosign "vuln" predicate (https://github.com/sigstore/cosign/blob/main/specs/COSIGN_VULN_ATTESTATION_SPEC.md)
          jq -n --slurpfile r out/trivy.json --arg s "$started" --arg f "$finished" \
            --arg uri "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{
              invocation: {uri: $uri, event_id: "", "builder.id": "", parameters: null},
              scanner: {uri: "pkg:github/aquasecurity/trivy@v0.76.1", version: "0.76.1",
                        db: {uri: "", version: ""}, result: $r[0]},
              metadata: {scanStartedOn: $s, scanFinishedOn: $f}
            }' > out/vuln-predicate.json
          echo "digest=${IMAGE#*@}" >> "$GITHUB_OUTPUT"
        id: scan
      - id: vuln
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/library/alpine
          subject-digest: ${{ steps.scan.outputs.digest }}
          predicate-type: https://cosign.sigstore.dev/attestation/vuln/v1
          predicate-path: out/vuln-predicate.json
      - run: cp "${{ steps.vuln.outputs.bundle-path }}" out/image.vuln.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: out/

  reusable:
    needs: sast
    uses: ./.github/workflows/reusable-attest.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  # A message signature over the report bytes (no in-toto statement), as `sigstore sign` and
  # `cosign sign-blob --bundle` produce. The usual choice where no attestation store exists.
  blob-sign:
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: semgrep-report
          path: in
      - run: |
          pip install "sigstore==4.5.1"
          mkdir -p out
          python -m sigstore sign --bundle out/semgrep.json.sigstore.json in/semgrep.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-blob
          path: out/

  # ScanProof verifies the attestations of THIS run with its default (online TUF) trust root.
  self-verify:
    needs: [sast, container, reusable, blob-sign]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      attestations: read   # GitHub attestations API (source: platform)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install ".[attestations]"
      - name: ScanProof verifies this run's attestations
        if: ${{ hashFiles('src/scanproof/attestation/verify.py') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RELEASE_IMAGE_DIGEST="${IMAGE#*@}"; export RELEASE_IMAGE_DIGEST
          set +e
          check() {  # check <policy> <expected exit>
            scanproof verify -P "$1" --pipeline "$GITHUB_RUN_ID" -p "$GITHUB_REPOSITORY" \
              -o "out-$(basename "$1" .yaml).json" 2> console.txt
            rc=$?
            msg=$(grep -E "^\[|ATTESTATION_|Decision" console.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::notice title=self-verify $(basename "$1") exit $rc (expected $2)::$msg"
            [ "$rc" = "$2" ] || failed=1
          }
          failed=0
          check examples/policies/attest-self-ok.yaml 0
          check examples/policies/attest-self-wrong-signer.yaml 1
          check examples/policies/attest-self-reusable.yaml 0
          check examples/policies/attest-self-reusable-caller.yaml 1
          exit $failed

  publish:
    needs: [sast, container, reusable, blob-sign]
    if: always() && startsWith(github.ref, 'refs/heads/fixtures/attest/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # this job pushes; everything else uses false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: generated-fixtures
      - name: Commit outputs back to this fixtures branch
        run: |
          set -o pipefail
          fail() { echo "::error title=publish::$1"; exit 1; }
          echo "run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT sha=$GITHUB_SHA" > generated-fixtures/run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f generated-fixtures 2>&1 | tail -3 || fail "git add failed"
          git diff --cached --quiet && fail "nothing to commit (artifact empty?)"
          out=$(git commit -q -m "chore: generated attestation fixtures [skip ci]" 2>&1) || fail "commit: $out"
          git pull -q --rebase origin "$GITHUB_REF_NAME" || fail "rebase failed"
          out=$(git push 2>&1) || fail "push: $(echo "$out" | tail -3 | tr '\n' ' ')"
