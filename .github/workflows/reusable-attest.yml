# Called by attestation-contract.yml: attests the caller's Semgrep report from a reusable workflow,
# so the Sigstore certificate's Build Signer URI names this file (Build Config URI names the caller).
name: reusable-attest

on:
  workflow_call:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: semgrep-report
          path: in
      - id: prov
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: in/semgrep.json
      - run: mkdir -p out && cp "${{ steps.prov.outputs.bundle-path }}" out/semgrep.json.reusable.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reusable-bundle
          path: out/
