# Demo: two release pipelines whose scan jobs are all green, gated by ScanProof.
#
#   healthy: Semgrep + Trivy on the image being released          -> VERIFIED (exit 0)
#   broken:  Semgrep crashed under continue-on-error, and Trivy
#            scanned a different image than the one being released  -> BLOCKED  (exit 1)
#
# Open a run in the Actions tab: each gate job's summary shows ScanProof's report.
# The workflow is green when both gates reach the expected decision.
name: demo

on:
  workflow_dispatch:
  push:
    branches: [main, "fixtures/demo/**"]

permissions:
  contents: read

env:
  # The image this "release" ships, pinned by digest.
  RELEASE_IMAGE: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc

jobs:
  # ---------------------------------------------------------------- healthy pipeline
  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/default --metrics=off --json --output semgrep.json examples/gitlab-ci/sample-app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: semgrep.json

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.76.1 image \
            --format json --output /out/trivy.json "$RELEASE_IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy.json

  # ---------------------------------------------------------------- broken pipeline
  sast-masked:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep (a config typo makes it fail)
        continue-on-error: true      # "don't block the release on scanner problems"
        run: semgrep scan --config p/defualt --metrics=off --json --output semgrep.json examples/gitlab-ci/sample-app/
      - run: echo "job still reports success"

  container-scan-drift:
    runs-on: ubuntu-latest
    steps:
      - name: trivy (scans a tag, not the released digest)
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.76.1 image \
            --format json --output /out/trivy.json alpine:3.21
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report-drift
          path: trivy.json

  # ---------------------------------------------------------------- gates
  gate:
    needs: [sast, container-scan, sast-masked, container-scan-drift]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pipeline: healthy, policy: examples/demo/release-ok.yaml, expect: 0}
          - {pipeline: broken, policy: examples/demo/release-broken.yaml, expect: 1}
    name: gate (${{ matrix.pipeline }})
    permissions:
      contents: read
      actions: read
      checks: read     # annotations reveal steps hidden by continue-on-error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install .
      - name: scanproof verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLICY: ${{ matrix.policy }}
          EXPECT: ${{ matrix.expect }}
          PIPELINE: ${{ matrix.pipeline }}
        run: |
          RELEASE_IMAGE_DIGEST="${RELEASE_IMAGE#*@}"; export RELEASE_IMAGE_DIGEST
          set +e
          scanproof verify -P "$POLICY" --pipeline "$GITHUB_RUN_ID" -p "$GITHUB_REPOSITORY" \
            -o report.json 2> console.txt
          rc=$?
          set -e
          cat console.txt
          {
            echo "## ScanProof: $PIPELINE pipeline (exit $rc, expected $EXPECT)"
            echo '```'
            cat console.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # One-line copy as an annotation, readable through the checks API.
          echo "::notice title=demo $PIPELINE exit $rc::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' console.txt)"
          test "$rc" = "$EXPECT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: scanproof-report-${{ matrix.pipeline }}
          path: report.json
