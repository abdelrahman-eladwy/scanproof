# Real API responses for the Azure DevOps, Bitbucket Pipelines and Jenkins connectors.
#
#   azure      anonymous reads of public Azure DevOps projects
#   bitbucket  anonymous reads of public Bitbucket repositories with Pipelines
#   jenkins    a throwaway Jenkins (tests/contract/jenkins/) running one pipeline per masking pattern
# On fixtures/platforms/** branches, `publish` commits the sanitized responses back.
name: platforms-contract

on:
  workflow_dispatch:
  push:
    branches: ["fixtures/platforms/**"]

permissions:
  contents: read

jobs:
  azure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python scripts/collect_azure_devops.py out/azure/dnceng-public dnceng-public public
          python scripts/collect_azure_devops.py out/azure/azure-sdk azure-sdk public
      - name: Summary as annotations
        run: |
          for f in out/azure/*/summary.json; do
            echo "::notice title=azure $(basename "$(dirname "$f")")::$(python3 -c "import json,sys;d=json.load(open('$f'));print(json.dumps({k:d[k] for k in ('saved_builds','downloads','api_zip')})[:3500])")"
            echo "::notice title=azure masked $(basename "$(dirname "$f")")::$(python3 -c "import json;d=json.load(open('$f'));print(json.dumps(d['masked'])[:3500])")"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure
          path: out/

  bitbucket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python scripts/collect_bitbucket.py out/bitbucket atlassian/git-secrets-scan \
            atlassian/aws-s3-deploy atlassian/bitbucket-upload-file atlassian/trigger-pipeline
      - run: echo "::notice title=bitbucket::$(python3 -c "import json;print(json.dumps(json.load(open('out/bitbucket/summary.json')))[:3500])")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitbucket
          path: out/

  jenkins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the throwaway Jenkins
        run: |
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          echo "SCANPROOF_JENKINS_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker build -q -t contract-jenkins tests/contract/jenkins
          docker run -d --name jenkins -p 8080:8080 -e SCANPROOF_JENKINS_PASSWORD="$pw" \
            -v "$PWD:/fixtures:ro" contract-jenkins
      - run: python scripts/collect_jenkins.py out/jenkins
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: ScanProof verifies the live Jenkins builds
        if: ${{ hashFiles('src/scanproof/connectors/jenkins.py') != '' }}
        env:
          JENKINS_URL: http://localhost:8080
          JENKINS_USER: scanproof
        run: |
          pip install -q .
          export JENKINS_TOKEN="$SCANPROOF_JENKINS_PASSWORD"
          failed=0
          for policy in tests/contract/policies/jenkins/*.yaml; do
            expect=$(sed -n 's/^# Expected exit: //p' "$policy")
            set +e
            scanproof verify --provider jenkins -P "$policy" --pipeline 1 -o /dev/null 2> console.txt
            rc=$?
            set -e
            msg=$(grep -E "^\[|FAIL:|UNKNOWN:|Decision" console.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::notice title=jenkins self-verify $(basename "$policy") exit $rc (expected $expect)::$msg"
            [ "$rc" = "$expect" ] || failed=1
          done
          exit $failed
      - name: Summary as annotations
        if: always()
        run: |
          [ -f out/jenkins/summary.json ] && echo "::notice title=jenkins::$(python3 -c "import json;print(json.dumps(json.load(open('out/jenkins/summary.json')))[:3800])")"
          docker logs jenkins 2>&1 | grep -iE "SEVERE|ERROR|exception" | head -20 | sed 's/^/::warning title=jenkins log::/' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jenkins
          path: out/

  publish:
    needs: [azure, bitbucket, jenkins]
    if: always() && startsWith(github.ref, 'refs/heads/fixtures/platforms/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # this job pushes; everything else uses false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: generated-fixtures
      - name: Commit outputs back to this fixtures branch
        run: |
          set -o pipefail
          fail() { echo "::error title=publish::$1"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f generated-fixtures 2>&1 | tail -3 || fail "git add failed"
          git diff --cached --quiet && fail "nothing to commit (artifact empty?)"
          out=$(git commit -q -m "chore: generated platform fixtures [skip ci]" 2>&1) || fail "commit: $out"
          git pull -q --rebase origin "$GITHUB_REF_NAME" || fail "rebase failed"
          out=$(git push 2>&1) || fail "push: $(echo "$out" | tail -3 | tr '\n' ' ')"
