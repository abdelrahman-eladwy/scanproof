# Real GitHub Actions scenarios for the GitHub connector, and ScanProof verifying its own run.
#
# Runs on fixtures/github/** branches (and manually). The scenario jobs reproduce what ScanProof
# must detect on GitHub; `self-verify` then runs `scanproof verify --provider github` against
# THIS run and checks the decision is the expected one.
name: github-contract

on:
  workflow_dispatch:
  push:
    branches: ["fixtures/github/**"]

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p reports
          semgrep scan --config p/default --metrics=off --json --output reports/semgrep.json examples/gitlab-ci/sample-app/
          semgrep scan --config p/default --metrics=off --sarif --output reports/semgrep.sarif examples/gitlab-ci/sample-app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: reports/

  # A scan step fails, but continue-on-error on the STEP keeps the job green.
  masked-step:
    runs-on: ubuntu-latest
    steps:
      - name: scanner crashes
        continue-on-error: true
        run: exit 1
      - run: echo "job still reports success"

  # The whole JOB fails, but continue-on-error on the JOB keeps the workflow green.
  masked-job:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: exit 1

  skipped-scan:
    if: ${{ github.event_name == 'never-happens' }}   # always skipped
    runs-on: ubuntu-latest
    steps:
      - run: echo never

  # Matrix: one instance hides a failing scan step behind continue-on-error.
  matrix-sast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [python, go]
    steps:
      - name: scan
        continue-on-error: ${{ matrix.lang == 'go' }}
        run: |
          if [ "${{ matrix.lang }}" = "go" ]; then exit 1; fi
          echo ok

  # 150 warning annotations first, so the masked failure lands on annotation page 2.
  noisy-masked:
    runs-on: ubuntu-latest
    steps:
      - run: for i in $(seq 1 150); do echo "::warning title=lint::finding $i"; done
      - name: scanner crashes
        continue-on-error: true
        run: exit 1

  reusable-call:
    uses: ./.github/workflows/reusable-scan.yml

  scope-free:
    runs-on: ubuntu-latest
    steps:
      - name: Produce syntactically valid but scope-free Semgrep-shaped report
        run: |
          mkdir -p reports
          printf '%s\n' '{"results":[],"errors":[]}' > reports/semgrep.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scope-free-report
          path: reports/semgrep.json

  self-verify:
    needs: [sast, masked-step, masked-job, skipped-scan, matrix-sast, noisy-masked, reusable-call, scope-free]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read     # annotations reveal steps hidden by continue-on-error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: ScanProof verifies this run
        if: ${{ hashFiles('src/scanproof/connectors/github.py') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          check() {  # check <policy> <expected exit>
            scanproof verify --provider github -P "$1" --pipeline "${{ github.run_id }}" \
              -p "${{ github.repository }}" -o "out-$(basename "$1" .yaml).json"
            rc=$?
            echo "::notice title=self-verify $(basename "$1")::exit $rc (expected $2)"
            [ "$rc" = "$2" ] || failed=1
          }
          failed=0
          check tests/contract/policies/github-self-sast.yaml 0
          check tests/contract/policies/github-self-masked-step.yaml 1
          check tests/contract/policies/github-self-masked-job.yaml 1
          check tests/contract/policies/github-self-skipped.yaml 1
          check tests/contract/policies/github-self-matrix.yaml 1
          check tests/contract/policies/github-self-noisy.yaml 1
          check tests/contract/policies/github-self-reusable.yaml 0

          # Extra real-provider tests for the opt-in reported_scope assurance.
          cat > /tmp/scanproof-scoped-ok.yaml <<'POLICY'
          apiVersion: scanproof.dev/v1alpha1
          kind: PipelineAssurancePolicy
          metadata: {name: scoped-ok}
          project: {provider: github, id: abdelrahman-eladwy/scanproof}
          assurance: {minimum_level: reported_scope}
          requirements:
            - id: SAST
              tool: semgrep
              job_name: sast
              artifact_name: semgrep-report
              report_path: semgrep.json
              checks: {scanner_errors_allowed: 0}
          enforcement: {on_unknown: block, on_nothing_applicable: block}
          POLICY
          cat > /tmp/scanproof-scoped-missing.yaml <<'POLICY'
          apiVersion: scanproof.dev/v1alpha1
          kind: PipelineAssurancePolicy
          metadata: {name: scoped-missing}
          project: {provider: github, id: abdelrahman-eladwy/scanproof}
          assurance: {minimum_level: reported_scope}
          requirements:
            - id: SAST
              tool: semgrep
              job_name: scope-free
              artifact_name: scope-free-report
              report_path: semgrep.json
          enforcement: {on_unknown: block, on_nothing_applicable: block}
          POLICY
          check /tmp/scanproof-scoped-ok.yaml 0
          check /tmp/scanproof-scoped-missing.yaml 2
          exit $failed
