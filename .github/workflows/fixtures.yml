# Generates REAL scanner reports used as test fixtures.
# Run manually (Actions > fixtures > Run workflow) when bumping supported scanner versions,
# then review and copy the outputs into tests/fixtures/{semgrep,trivy}/.
name: fixtures

on:
  workflow_dispatch:
  push:
    branches: ["fixtures/scanners/**"]

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Findings report (vulnerable sample app)
        run: semgrep scan --config p/default --metrics=off --json --output semgrep-findings.json examples/gitlab-ci/sample-app/
      - name: Clean report (no findings)
        run: |
          mkdir -p /tmp/clean && printf 'def add(a, b):\n    return a + b\n' > /tmp/clean/ok.py
          semgrep scan --config p/default --metrics=off --json --output semgrep-clean.json /tmp/clean/
      - name: Report with parse errors
        run: |
          mkdir -p /tmp/broken && cp examples/gitlab-ci/sample-app/app.py /tmp/broken/
          printf 'def broken(:\n    return (\n' > /tmp/broken/bad.py
          semgrep scan --config p/default --metrics=off --json --output semgrep-errors.json /tmp/broken/ || true
      - run: semgrep --version > semgrep-version.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-fixtures
          path: semgrep-*

  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Image report (released image)
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.76.1 image \
            --format json --output /out/trivy-python.json python:3.12-slim
      - name: Image report (a different image)
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.76.1 image \
            --format json --output /out/trivy-alpine.json alpine:3.20
      - run: |
          docker run --rm aquasec/trivy:0.76.1 --version > trivy-version.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fixtures
          path: trivy-*

  # GitLab's own analyzers (what GitLab SAST / Container Scanning templates run), producing the
  # GitLab security report format (gl-*-report.json).
  gitlab-analyzers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GitLab Semgrep analyzer -> gl-sast-report.json
        run: |
          mkdir -p out && cp -r examples/gitlab-ci/sample-app work-sast && chmod -R a+rwX work-sast
          for tag in 6 5 4; do
            img="registry.gitlab.com/security-products/semgrep:$tag"
            if docker run --rm -v "$PWD/work-sast:/app" -w /app -e CI_PROJECT_DIR=/app "$img" /analyzer run \
               && [ -s work-sast/gl-sast-report.json ]; then
              cp work-sast/gl-sast-report.json out/gl-sast-report.json
              echo "$img" > out/gl-sast-analyzer.txt
              echo "::notice title=gitlab-semgrep::$img produced gl-sast-report.json"; break
            fi
            echo "::warning title=gitlab-semgrep::$img failed"
          done
      - name: GitLab container scanning -> gl-container-scanning-report.json
        run: |
          mkdir -p work-cs && chmod a+rwx work-cs
          for tag in 8 7 6; do
            img="registry.gitlab.com/security-products/container-scanning:$tag"
            if docker run --rm -v "$PWD/work-cs:/work" -w /work -e CI_PROJECT_DIR=/work \
                 -e CS_IMAGE=python:3.12-slim "$img" gtcs scan \
               && [ -s work-cs/gl-container-scanning-report.json ]; then
              cp work-cs/gl-container-scanning-report.json out/gl-container-scanning-report.json
              echo "$img" > out/gl-cs-analyzer.txt
              echo "::notice title=gitlab-cs::$img produced gl-container-scanning-report.json"; break
            fi
            echo "::warning title=gitlab-cs::$img failed"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitlab-analyzer-fixtures
          path: out/
          if-no-files-found: warn

  # Standard formats (SARIF, CycloneDX) and extra scan types (secrets, IaC, dependencies).
  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p out && chmod a+rwx out
      - name: Semgrep SARIF
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.181.1 semgrep scan \
            --config p/default --metrics=off --sarif --output out/semgrep.sarif examples/gitlab-ci/sample-app/
          echo "::notice title=semgrep-sarif::ok"
      - name: Trivy SARIF + CycloneDX (image) and filesystem JSON
        continue-on-error: true
        run: |
          T="docker run --rm -v $PWD:/w -w /w aquasec/trivy:0.76.1"
          $T image --format sarif --output out/trivy-image.sarif python:3.12-slim
          $T image --format cyclonedx --output out/trivy-image.cdx.json python:3.12-slim
          $T fs --format json --output out/trivy-fs.json examples/sample-projects/node
          echo "::notice title=trivy-formats::ok"
      - name: Syft CycloneDX SBOM
        continue-on-error: true
        run: |
          docker run --rm anchore/syft:latest version | head -3 > out/syft-version.txt
          docker run --rm anchore/syft:latest alpine:3.20 -o cyclonedx-json > out/syft-alpine.cdx.json
          echo "::notice title=syft::$(head -1 out/syft-version.txt)"
      - name: gitleaks SARIF (random fake token, redacted)
        continue-on-error: true
        run: |
          mkdir -p /tmp/leak && chmod a+rwx /tmp/leak
          tok="ghp_$(head -c 200 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'config:\n  github_token: "%s"\n' "$tok" > /tmp/leak/config.yml
          docker run --rm -v /tmp/leak:/scan -v "$PWD/out:/out" zricethezav/gitleaks:latest \
            dir /scan --redact --report-format sarif --report-path /out/gitleaks.sarif --exit-code 0 \
            || docker run --rm -v /tmp/leak:/scan -v "$PWD/out:/out" zricethezav/gitleaks:latest \
            detect --no-git --source /scan --redact --report-format sarif --report-path /out/gitleaks.sarif --exit-code 0
          docker run --rm zricethezav/gitleaks:latest version > out/gitleaks-version.txt
          ! grep -q "$tok" out/gitleaks.sarif || { echo "::error::unredacted token in report"; rm out/gitleaks.sarif; exit 1; }
          echo "::notice title=gitleaks::$(cat out/gitleaks-version.txt)"
      - name: Checkov native JSON + SARIF
        continue-on-error: true
        run: |
          pip install -q checkov
          checkov --version > out/checkov-version.txt
          checkov -d examples/sample-projects/terraform -o json -o sarif --output-file-path out --soft-fail --quiet || true
          ls out
          [ -f out/results_json.json ] && mv out/results_json.json out/checkov.json
          [ -f out/results_sarif.sarif ] && mv out/results_sarif.sarif out/checkov.sarif
          echo "::notice title=checkov::$(cat out/checkov-version.txt) files: $(ls out | tr '\n' ' ')"
      - name: GitLab secret detection analyzer
        continue-on-error: true
        run: |
          mkdir -p work-secrets && chmod a+rwx work-secrets
          tok="ghp_$(head -c 200 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'token = "%s"\n' "$tok" > work-secrets/settings.py
          for tag in 7 6 5; do
            img="registry.gitlab.com/security-products/secrets:$tag"
            if docker run --rm -v "$PWD/work-secrets:/code" -w /code -e CI_PROJECT_DIR=/code "$img" /analyzer run \
               && [ -s work-secrets/gl-secret-detection-report.json ]; then
              python3 - "$tok" <<'PY'
          import json, sys
          tok = sys.argv[1]
          p = "work-secrets/gl-secret-detection-report.json"
          d = json.load(open(p))
          for v in d.get("vulnerabilities", []):
              for k in ("raw_source_code_extract",):
                  v.pop(k, None)
          s = json.dumps(d, indent=2).replace(tok, "REDACTED")
          open("out/gl-secret-detection-report.json", "w").write(s)
          PY
              echo "$img" > out/gl-secrets-analyzer.txt
              echo "::notice title=gitlab-secrets::$img ok"; break
            fi
            echo "::warning title=gitlab-secrets::$img failed"
          done
      - name: GitLab dependency scanning analyzer
        continue-on-error: true
        run: |
          cp -r examples/sample-projects/node work-deps && chmod -R a+rwX work-deps
          for img in registry.gitlab.com/security-products/gemnasium:6 registry.gitlab.com/security-products/gemnasium:5 registry.gitlab.com/security-products/dependency-scanning:0; do
            if docker run --rm -v "$PWD/work-deps:/code" -w /code -e CI_PROJECT_DIR=/code "$img" /analyzer run \
               && [ -s work-deps/gl-dependency-scanning-report.json ]; then
              cp work-deps/gl-dependency-scanning-report.json out/
              echo "$img" > out/gl-deps-analyzer.txt
              echo "::notice title=gitlab-deps::$img ok"; break
            fi
            echo "::warning title=gitlab-deps::$img failed"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: format-fixtures
          path: out/

  # On fixtures/scanners/** branches, commit the reports back so they can be fetched with git
  # (useful where artifact storage is not reachable). Never runs on main.
  publish:
    needs: [semgrep, trivy, gitlab-analyzers, formats]
    if: always() && startsWith(github.ref, 'refs/heads/fixtures/scanners/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # this job pushes; everything else uses false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: generated-fixtures
      - name: Commit outputs back to this fixtures branch
        run: |
          set -o pipefail
          fail() { echo "::error title=publish::$1"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f generated-fixtures 2>&1 | tail -3 || fail "git add failed"
          git diff --cached --quiet && fail "nothing to commit (artifact empty?)"
          out=$(git commit -q -m "chore: generated fixtures [skip ci]" 2>&1) || fail "commit: $out"
          git pull -q --rebase origin "$GITHUB_REF_NAME" || fail "rebase failed"
          out=$(git push 2>&1) || fail "push: $(echo "$out" | tail -3 | tr '\n' ' ')"
