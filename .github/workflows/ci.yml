name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tags are mutable). Dependabot keeps them current.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Start measurable test job
        run: |
          echo "SCANPROOF_CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p build
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: >-
          pytest --cov=scanproof --cov-branch --cov-report=term-missing
          --cov-report=json:build/coverage.json --junitxml=build/junit.xml
          --cov-fail-under=90
      - name: Record and enforce test quality baseline
        run: >-
          python scripts/ci_baseline.py tests --junit build/junit.xml
          --coverage build/coverage.json --output build/ci-baseline.json
      - name: Record large-pipeline matching timings and memory (not an end-to-end SLO)
        run: >-
          python scripts/benchmark_job_matching.py
          --output build/job-matching-benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-quality-${{ matrix.python }}
          path: build/
          if-no-files-found: warn

  lowest-deps:
    # The oldest dependency versions pyproject.toml allows must really work, with and without
    # the attestations extra (sigstore raises some floors; the core must not need it).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: core, install: ".", constraints: tests/constraints-lowest.txt}
          - {name: attestations, install: ".[attestations]", constraints: tests/constraints-lowest-attestations.txt}
    name: lowest-deps (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e "${{ matrix.install }}" pytest pytest-cov respx -c "${{ matrix.constraints }}"
      - run: pytest -q -rs

  package:
    # Build the wheel exactly as release.yml does and run it from outside the source tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Start measurable package job
        run: |
          echo "SCANPROOF_CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p build
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and smoke test it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp
          /tmp/v/bin/scanproof --version
          /tmp/v/bin/scanproof evidence -t semgrep -q \
            -f "$GITHUB_WORKSPACE/tests/fixtures/semgrep/semgrep-findings.json" > /dev/null
          RELEASE_IMAGE_DIGEST="sha256:$(printf '0%.0s' $(seq 64))" \
            /tmp/v/bin/scanproof validate -P "$GITHUB_WORKSPACE/examples/policies/sarif-and-sbom.yaml"
          set +e; /tmp/v/bin/scanproof evidence -t nosuch -f /dev/null; rc=$?; set -e
          test "$rc" = 3
      - name: Full suite, adversarial decision matrix included, against the installed wheel
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install "$(ls dist/*.whl)[attestations]" pytest respx
          scripts/test_installed.sh /tmp/w/bin/python "$GITHUB_WORKSPACE"
      - name: Record and enforce wheel/sdist sizes and digests
        run: >-
          python scripts/ci_baseline.py artifacts --dist dist
          --output build/ci-package.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-package-quality
          path: build/ci-package.json
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t scanproof:ci .
      - name: Smoke test (runs as non-root)
        run: |
          docker run --rm scanproof:ci --version
          uid=$(docker run --rm --entrypoint id scanproof:ci -u)   # fails the step if docker fails
          test -n "$uid" && test "$uid" != "0"
          docker run --rm -v "$PWD/tests/fixtures:/fx:ro" scanproof:ci \
            evidence -t semgrep -f /fx/semgrep/semgrep-findings.json -q > /dev/null
          docker run --rm -v "$PWD/tests/fixtures:/fx:ro" scanproof:ci attestation --sigstore-offline \
            -b /fx/attestations/semgrep.provenance.sigstore.json -f /fx/attestations/semgrep.json \
            | grep -q '"status": "verified"'
      - name: Full suite, adversarial decision matrix included, inside the image (non-root)
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/repo:ro" scanproof:ci -c \
            'pip install --user --no-cache-dir -q pytest respx && sh /repo/scripts/test_installed.sh python /repo'
