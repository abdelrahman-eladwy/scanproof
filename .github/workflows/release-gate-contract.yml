# Live adversarial contract. It is EXPECTED that the overall workflow is red:
# gate-bad must fail with a real ScanProof exit 2, and deploy-bad must be skipped.
# The assert-contract job must be GREEN, proving that the failure blocked deployment.
# Only runs on opt-in fixture branches or a manual dispatch; never deploys anything.
name: release-gate-contract

on:
  workflow_dispatch:
  push:
    branches: ["fixtures/gate/**"]

permissions:
  contents: read

jobs:
  scan-good:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan actual source
        run: semgrep scan --config p/default --metrics=off --json --output semgrep.json examples/gitlab-ci/sample-app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-semgrep-good
          path: semgrep.json
          if-no-files-found: error

  scan-scope-free:
    runs-on: ubuntu-latest
    steps:
      - name: Publish deliberately inadequate scanner-shaped JSON
        run: |
          printf '%s\n' '{"results":[],"errors":[]}' > semgrep.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-semgrep-empty
          path: semgrep.json
          if-no-files-found: error

  gate-good:
    needs: [scan-good]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Verify before healthy deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scanproof verify --provider github -P examples/policies/github-release-contract-good.yaml --pipeline "$GITHUB_RUN_ID" -p "$GITHUB_REPOSITORY" -o gate-good.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: contract-gate-good
          path: gate-good.json
          if-no-files-found: error

  gate-bad:
    needs: [scan-scope-free]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Fail closed on missing scanner coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Intentionally NO continue-on-error, and no expected-exit wrapper.
        run: scanproof verify --provider github -P examples/policies/github-release-contract-bad.yaml --pipeline "$GITHUB_RUN_ID" -p "$GITHUB_REPOSITORY" -o gate-bad.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: contract-gate-bad
          path: gate-bad.json
          if-no-files-found: error

  deploy-good:
    needs: [gate-good]
    runs-on: ubuntu-latest
    steps:
      - name: Dry-run deployment marker (no real deployment)
        run: printf '%s\n' "Healthy deployment reached" > deploy-good.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-deploy-good
          path: deploy-good.txt
          if-no-files-found: error

  deploy-bad:
    # SECURITY PROBE - deliberately wrong dependency, DO NOT MERGE.
    # This bypasses the required gate. The PR exists only to test ruleset enforcement.
    needs: [scan-scope-free]
    runs-on: ubuntu-latest
    steps:
      - name: Must never execute
        run: |
          printf '%s\n' "ERROR: broken release reached deploy" > deploy-bad.txt
          exit 1

  assert-contract:
    if: ${{ always() }}
    needs: [gate-good, gate-bad, deploy-good, deploy-bad]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: contract-gate-*
          merge-multiple: true
          path: reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract-deploy-good
          path: deploy-evidence
      - name: Assert actual release dependency graph and policy decisions
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = {
              "gate-good": "success",
              "deploy-good": "success",
              "gate-bad": "failure",
              "deploy-bad": "skipped",
          }
          actual = {job: needs[job]["result"] for job in expected}
          print("Actual jobs:", actual)
          assert actual == expected, f"Release dependency graph violated: {actual}"

          healthy = json.loads(Path("reports/gate-good.json").read_text())
          broken = json.loads(Path("reports/gate-bad.json").read_text())
          assert healthy["decision"] == "VERIFIED" and healthy["exit_code"] == 0
          assert broken["decision"] == "INDETERMINATE" and broken["exit_code"] == 2
          codes = [
              check["code"]
              for requirement in broken["requirements"]
              for check in requirement["checks"]
          ]
          assert "SCAN_SCOPE_UNKNOWN" in codes, f"Unexpected rejection reason: {codes}"
          marker = Path("deploy-evidence/deploy-good.txt").read_text()
          assert "Healthy deployment reached" in marker
          print("PASS: healthy release reached dry-run deploy")
          print("PASS: scope-free evidence failed at gate, broken deploy never ran")
          PY
