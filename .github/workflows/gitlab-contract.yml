# Contract test against the REAL gitlab.com API (public projects, anonymous, read-only).
#
# - Weekly / manual: runs `scanproof inspect --anonymous` on recent public pipelines and fails
#   if ScanProof can no longer read GitLab's responses (API drift).
# - On fixtures/gitlab/** branches: also commits sanitized API responses and security reports back to
#   the branch, to refresh tests/fixtures/gitlab-real/.
name: gitlab-contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: ["fixtures/gitlab/**"]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Collect real GitLab responses
        run: python scripts/collect_gitlab_contract.py gitlab-contract
      - name: Run scanproof inspect --anonymous on each pipeline found
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          summary = json.load(open("gitlab-contract/summary.json"))
          for e in summary:  # annotations are readable via the API even when logs are not
              print("::notice title=contract " + e["project"].split("/")[-1] + "::" + json.dumps(e)[:3500])
          found = [e for e in summary if "pipeline_id" in e]
          if not found:
              sys.exit("No public pipeline with security reports found; update CANDIDATES")
          failed = False
          for e in found:
              slug = e["project"].split("/")[-1]
              out = f"gitlab-contract/{slug}/inspection.json"
              cmd = ["scanproof", "inspect", "--anonymous", "-p", e["project"],
                     "--pipeline", str(e["pipeline_id"]), "-o", out]
              rc = subprocess.run(cmd).returncode
              print(f"{e['project']} pipeline {e['pipeline_id']}: exit {rc}")
              failed |= rc != 0
          sys.exit(1 if failed else 0)
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitlab-contract
          path: gitlab-contract/

  publish:
    if: startsWith(github.ref, 'refs/heads/fixtures/gitlab/')
    needs: contract
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # this job pushes; everything else uses false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitlab-contract
          path: generated-gitlab-contract
      - name: Commit outputs back to this fixtures branch
        run: |
          set -o pipefail
          fail() { echo "::error title=publish::$1"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f generated-gitlab-contract 2>&1 | tail -3 || fail "git add failed"
          git diff --cached --quiet && fail "nothing to commit (artifact empty?)"
          out=$(git commit -q -m "chore: generated fixtures [skip ci]" 2>&1) || fail "commit: $out"
          git pull -q --rebase origin "$GITHUB_REF_NAME" || fail "rebase failed"
          out=$(git push 2>&1) || fail "push: $(echo "$out" | tail -3 | tr '\n' ' ')"
