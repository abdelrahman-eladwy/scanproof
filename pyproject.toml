[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "scanproof"
version = "0.1.0.dev0"
description = "Security Scan Assurance Engine: verify that required security scans ran, produced valid evidence, and covered the release."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Abdelrahman" }]
keywords = ["devsecops", "appsec", "gitlab", "github-actions", "semgrep", "trivy", "sarif", "sbom", "ci-cd", "security"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.13",  # 0.12 cannot handle `str | None` options
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0.1",  # 6.0 no longer builds (Cython 3)
  "defusedxml>=0.7.1",  # Fortify FVDL is untrusted XML: block entity expansion / external entities
]

[project.urls]
Homepage = "https://github.com/abdelrahman-eladwy/scanproof"
Documentation = "https://github.com/abdelrahman-eladwy/scanproof/tree/main/docs"
Issues = "https://github.com/abdelrahman-eladwy/scanproof/issues"
Changelog = "https://github.com/abdelrahman-eladwy/scanproof/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.22",  # 0.21 breaks with httpx 0.28
  "ruff>=0.6",
]

[project.scripts]
scanproof = "scanproof.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/scanproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples/gitlab-ci/sample-app"]  # deliberately vulnerable demo code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hard-coded fake tokens in tests
