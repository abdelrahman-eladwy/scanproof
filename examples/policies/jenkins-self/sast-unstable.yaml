# Live Jenkins contract (.github/workflows/platforms-contract.yml): job sast-unstable, build #1.
# Expected exit: 1
apiVersion: scanproof.dev/v1alpha1
kind: PipelineAssurancePolicy
metadata: {name: jenkins-self-sast-unstable}
project: {provider: jenkins, id: sast-unstable}
requirements:
  - id: SAST
    tool: semgrep
    job_name: "Scan"
    report_path: semgrep.json
    checks: {same_commit: false}   # the contract jobs have no SCM checkout
