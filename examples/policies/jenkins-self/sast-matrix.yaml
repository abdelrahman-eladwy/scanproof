# Live Jenkins contract (.github/workflows/platforms-contract.yml): job sast-matrix, build #1.
# Expected exit: 1
apiVersion: scanproof.dev/v1alpha1
kind: PipelineAssurancePolicy
metadata: {name: jenkins-self-sast-matrix}
project: {provider: jenkins, id: sast-matrix}
requirements:
  - id: SAST
    tool: semgrep
    job_name: "sast"
    report_path: python/semgrep.json
    checks: {same_commit: false}   # the contract jobs have no SCM checkout
