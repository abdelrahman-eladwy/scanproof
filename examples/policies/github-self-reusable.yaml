# ScanProof verifying its own GitHub Actions run (github-contract.yml).
# Expected: VERIFIED (exit 0): the job ran inside a reusable workflow
apiVersion: scanproof.dev/v1alpha1
kind: PipelineAssurancePolicy
metadata: {name: github-self-reusable}
project: {provider: github, id: abdelrahman-eladwy/scanproof}
requirements:
  - id: SCAN
    tool: semgrep
    job_name: callee-sast
    artifact_name: none
    report_path: none.json
    checks:
      report_required: false   # this scenario is about the job result, not a report
