# Demo (.github/workflows/demo.yml): the healthy release pipeline. Expected: VERIFIED (exit 0).
apiVersion: scanproof.dev/v1alpha1
kind: PipelineAssurancePolicy
metadata: {name: demo-release-ok}
project: {provider: github, id: abdelrahman-eladwy/scanproof}
requirements:
  - id: SAST
    tool: semgrep
    job_name: sast
    artifact_name: semgrep-report
    report_path: semgrep.json
    checks:
      scanner_errors_allowed: 0
      required_paths: ["examples/gitlab-ci/sample-app/"]
  - id: CONTAINER
    tool: trivy
    job_name: container-scan
    artifact_name: trivy-report
    report_path: trivy.json
    checks:
      image_digest_must_match: ${RELEASE_IMAGE_DIGEST}
